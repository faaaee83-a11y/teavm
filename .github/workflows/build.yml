name: Build TeaVM
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B package
      - run: cp src/main/webapp/index.html target/web/
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: target/web/
